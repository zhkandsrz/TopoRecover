[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toporecover"
version = "0.1.0"
description = "Topology-aware localization and repair of CAD command sequences"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cadquery==2.7.0", "numpy>=1.26,<3", "scipy>=1.11,<2", "trimesh==4.11.2", "shapely>=2,<3"]

[project.optional-dependencies]
llm = ["torch>=2.3,<3", "transformers==4.51.3", "lm-format-enforcer==0.11.3", "accelerate>=0.30,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
